# /etc/nginx/sites-available/parshukov-site
# Статичный сайт из dist/ (tools/export_prod.py) + обработчик форм send.php.
# Сертификат Let's Encrypt выпущен certbot, продлевается certbot.timer.
# 04.11.2026: http2, server_tokens off, кеш HTML с проверкой, gzip_vary, /portfolio/ -> 301, 403 -> 404.

limit_req_zone $binary_remote_addr zone=vp_forms:1m rate=6r/m;

# http, www и голый IP ведут на https://parkovagency.com
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://parkovagency.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.parkovagency.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/parkovagency.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parkovagency.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://parkovagency.com$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name parkovagency.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/parkovagency.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parkovagency.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/parshukov-site;
    index index.html;
    charset utf-8;

    include snippets/parshukov-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json image/x-icon;

    error_page 404 /404/index.html;
    # Папки без index.html (например /shared/img/) отдают 404, а не 403
    error_page 403 =404 /404/index.html;

    # /brief/index.html → /brief/ (по $request_uri, чтобы не зациклить внутренний переход на index.html)
    if ($request_uri ~ "^([^?]*/)index\.html(\?.*)?$") {
        return 301 $1$2;
    }

    location = /send.php {
        limit_req zone=vp_forms burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    # Другие .php не исполняем и не отдаём, служебные файлы скрыты
    location ~ \.php$ { return 404; }
    location ~ /\. { return 404; }

    # Отдельной страницы раздела нет, ведём на общий список работ
    location = /portfolio/ {
        return 301 /portfolio/complex/;
    }

    # CSS и JS в HTML идут с ?v=<хеш>, поэтому долгий кеш не мешает обновлениям
    location /shared/ {
        add_header Cache-Control "public, max-age=2592000";
        include snippets/parshukov-headers.conf;
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=2592000";
        include snippets/parshukov-headers.conf;
        log_not_found off;
    }

    # HTML: браузер хранит копию, но перед показом сверяется с сервером (ответ 304, если не менялось)
    location / {
        add_header Cache-Control "no-cache";
        include snippets/parshukov-headers.conf;
        try_files $uri $uri/ =404;
    }
}
