# /etc/nginx/sites-available/parshukov-site
# Статичный сайт из dist/ (tools/export_prod.py) + обработчик форм send.php.
# Сертификат Let's Encrypt выпущен certbot, продлевается certbot.timer.

limit_req_zone $binary_remote_addr zone=vp_forms:1m rate=6r/m;

# http, www и голый IP ведут на https://parkovagency.com
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://parkovagency.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.parkovagency.com;
    ssl_certificate /etc/letsencrypt/live/parkovagency.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parkovagency.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://parkovagency.com$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name parkovagency.com;
    ssl_certificate /etc/letsencrypt/live/parkovagency.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parkovagency.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/parshukov-site;
    index index.html;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json;

    error_page 404 /404/index.html;

    # /brief/index.html → /brief/ (по $request_uri, чтобы не зациклить внутренний переход на index.html)
    if ($request_uri ~ "^([^?]*/)index\.html(\?.*)?$") {
        return 301 $1$2;
    }

    location = /send.php {
        limit_req zone=vp_forms burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    # Другие .php не исполняем и не отдаём, служебные файлы скрыты
    location ~ \.php$ { return 404; }
    location ~ /\. { return 404; }

    location /shared/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
